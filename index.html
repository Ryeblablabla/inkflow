<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="INKFLOW · Open-source real-time Chinese ink brushes and rendering for Three.js"><title>INKFLOW · 实时水墨</title><link rel="icon" href="data:,"></head><body><canvas id="world"></canvas><canvas id="pad" width="1500" height="1000" hidden></canvas><header><div><span class="seal">墨</span><h1>INKFLOW</h1><p>实时水墨 · Three.js</p></div><a href="https://github.com/Ryeblablabla/inkflow" target="_blank" rel="noreferrer">GitHub ↗</a></header><nav aria-label="对象"><button data-subject="pine" class="active">松</button><button data-subject="rock">石</button><button data-subject="serpent">游动曲面</button><button data-subject="brush">试笔</button><button id="import">导入 GLB</button><input id="file" type="file" accept=".glb" hidden></nav><aside><div class="modes"><button data-mode="gray">灰模</button><button data-mode="ink" class="active">水墨</button><button data-mode="compare">对照</button></div><label>浓淡<input id="density" aria-label="浓淡" type="range" min=".3" max="2" step=".01" value="1.16"></label><label>飞白<input id="dry" aria-label="飞白" type="range" min="0" max="1" step=".01" value=".5"></label><label>流墨<input id="flow" aria-label="流墨" type="range" min="0" max="1" step=".01" value=".68"></label><button id="pause">暂停</button><button id="save">保存</button></aside><p id="status" role="status">正在研墨…</p><footer>拖动旋转 · 滚轮缩放</footer><script type="module" src="/examples/main.js"></script></body></html>
